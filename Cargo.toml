[package]
name = "csi-webserver"
version = "0.2.0"
edition = "2024"
description = "CSI webserver executable — hotplug supervisor, HTTP API, and WebSocket streaming for ESP32 CSI capture"
license = "Apache-2.0"
readme = "CRATES.md"
repository = "https://github.com/csi-rs/csi-webserver-rs"
documentation = "https://github.com/csi-rs/csi-webserver-rs/blob/main/API.md"
keywords = ["esp32", "csi", "websocket", "serial", "cli"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.85"
include = ["src/**/*", "Cargo.toml", "README.md", "CRATES.md", "API.md", "LICENSE"]
authors = ["stacks-of-data", "theembeddedrustacean"]

[[bin]]
name = "csi-webserver"
path = "src/main.rs"

[dependencies]
csi-webserver-core = { path = "../csi-pipeline/csi-webserver-core", version = "0.1.0" }
clap = { version = "4.6.1", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
